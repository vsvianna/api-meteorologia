<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clima agora</title>
  <meta name="description" content="Clima atual e previsão de sete dias para qualquer cidade, feito com Flask e Open-Meteo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⛅%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;400;500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-tempo="limpo">
  <main>
    <form class="busca" id="busca" role="search" autocomplete="off">
      <div class="campo">
        <label class="sr-only" for="cidade">Cidade</label>
        <input id="cidade" name="cidade" type="text" placeholder="Buscar cidade"
               role="combobox" aria-autocomplete="list" aria-expanded="false"
               aria-controls="sugestoes" spellcheck="false" autocapitalize="words">
        <ul class="sugestoes" id="sugestoes" role="listbox" aria-label="Cidades encontradas" hidden></ul>
      </div>
      <button type="submit">Buscar</button>
      <button type="button" id="localizacao">Usar minha localização</button>
    </form>

    <p class="aviso" id="aviso" role="status" aria-live="polite">Carregando…</p>

    <section class="agora" id="agora" aria-labelledby="local" hidden>
      <div class="agora__principal">
        <h1 class="local" id="local"></h1>
        <p class="regiao" id="regiao"></p>
        <p class="temperatura">
          <span id="temp" aria-hidden="true"></span>
          <span class="sr-only" id="temp-sr"></span>
        </p>
        <p class="condicao">
          <span class="icone" id="icone" aria-hidden="true"></span>
          <span id="condicao"></span>
        </p>
        <p class="hoje" id="hoje"></p>
      </div>
      <dl class="detalhes">
        <div>
          <dt>Sensação térmica</dt>
          <dd id="sensacao"></dd>
        </div>
        <div>
          <dt>Umidade</dt>
          <dd id="umidade"></dd>
        </div>
        <div>
          <dt>Vento</dt>
          <dd id="vento"></dd>
        </div>
      </dl>
    </section>

    <section class="semana" id="semana" aria-labelledby="semana-titulo" hidden>
      <h2 id="semana-titulo">Próximos 7 dias</h2>
      <ol class="dias" id="dias"></ol>
    </section>

    <noscript>
      <p class="aviso">Esta página precisa de JavaScript. A API continua disponível em <a href="/status">/status</a>.</p>
    </noscript>
  </main>

  <footer class="rodape">
    <p>
      Dados da <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>.
      Esta página usa a API do próprio projeto: veja o
      <a id="json-clima" href="/status" target="_blank" rel="noopener">JSON do clima atual</a>
      e o
      <a id="json-previsao" href="/status" target="_blank" rel="noopener">JSON da previsão</a>.
      <a href="https://github.com/vsvianna/api-meteorologia" target="_blank" rel="noopener">Código no GitHub</a>.
    </p>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
